name: Tests

# Runs the full regression suite (tests/README.md) on every push and pull
# request against main, so a broken change gets caught here instead of
# shipping silently to the live app. `npm test` regenerates fixtures from
# the real index.html and runs every case in tests/cases/ -- same thing
# you'd run locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  sql-test:
    # tests/sql/job_financials_test.sql -- the JS suite above only ever mocks
    # job_margins' output, never runs the real SQL that computes it. This
    # spins up a throwaway Postgres and runs the view's actual formula
    # against hand-calculated expected values, so a wrong edit to the view
    # gets caught here instead of showing up as a wrong number in production.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql/job_financials_test.sql
      # tests/sql/task_repeat_test.sql -- runs the real supabase/100_task_repeat.sql
      # (next-due-date math + the trigger that creates the next copy of a
      # repeating task when it's completed), which the mocked JS suite can't see.
      - run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f tests/sql/task_repeat_test.sql
